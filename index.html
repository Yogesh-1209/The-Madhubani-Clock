<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yogi's Madhubani Clock</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Varela+Round&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --madhubani-bg: #FCF4DF;
            --madhubani-border: #8B0000;
            --madhubani-red: #D32F2F;
            --madhubani-green: #388E3C;
            --madhubani-blue: #1976D2;
            --madhubani-text: #212121;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--madhubani-bg);
            /* Subtle handmade paper texture */
            background-image: 
                linear-gradient(rgba(252, 244, 223, 0.9), rgba(252, 244, 223, 0.9)),
                url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3%3Cpath d="M10 20 L20 10 L30 20 L20 30 Z" fill="%23D32F2F" fill-opacity="0.05"/%3%3C/svg%3E');
            font-family: 'Varela Round', sans-serif;
            overflow: hidden;
            padding: 15px; /* Ensures it doesn't touch screen edges on mobile */
        }

        #root {
            width: 100%;
            max-width: 500px;
        }

        .clock-container {
            position: relative;
            background-color: var(--madhubani-bg);
            /* Scaling Border: Thicker on Desktop, thinner on Mobile */
            border: clamp(8px, 3vw, 18px) solid var(--madhubani-border);
            border-image: repeating-linear-gradient(
                -45deg,
                var(--madhubani-red),
                var(--madhubani-red) 5px,
                var(--madhubani-green) 5px,
                var(--madhubani-green) 10px,
                var(--madhubani-blue) 10px,
                var(--madhubani-blue) 15px
            ) 20;
            
            padding: clamp(1.2rem, 5vw, 3rem);
            text-align: center;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.1);
        }

        .header-title {
            font-family: 'Uncial Antiqua', serif;
            font-size: clamp(1.1rem, 5vw, 2rem);
            color: var(--madhubani-text);
            margin-bottom: 0.8rem;
            border-bottom: 2px solid var(--madhubani-text);
            display: inline-block;
            padding-bottom: 5px;
            letter-spacing: 1px;
        }

        .decor-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(5px, 2vw, 15px);
            margin: 10px 0;
            line-height: 1;
        }

        .peacock-feather {
            font-size: clamp(1.5rem, 8vw, 3rem);
        }

        .symbol {
            font-size: clamp(0.8rem, 4vw, 1.2rem);
            opacity: 0.8;
        }

        .time-display {
            font-family: 'Uncial Antiqua', serif;
            /* Fluid Typography: min 2.8rem, max 6rem */
            font-size: clamp(2.8rem, 14vw, 6rem);
            font-weight: 700;
            color: var(--madhubani-text);
            margin: 0.5rem 0;
            display: flex;
            justify-content: center;
            align-items: baseline;
            letter-spacing: -2px;
        }

        .seconds {
            font-size: 0.4em;
            opacity: 0.6;
            margin-left: 8px;
            font-weight: 400;
        }

        .date-display {
            font-size: clamp(0.85rem, 3.5vw, 1.1rem);
            color: var(--madhubani-text);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        /* Subtle Inner Border decoration */
        .clock-container::after {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid rgba(0,0,0,0.1);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [time, setTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const hours = time.getHours().toString().padStart(2, '0');
            const minutes = time.getMinutes().toString().padStart(2, '0');
            const seconds = time.getSeconds().toString().padStart(2, '0');

            const dateStr = time.toLocaleDateString('en-IN', { 
                weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
            });

            const MadhubaniDecor = () => (
                <div className="decor-row">
                    <span className="symbol" style={{color: 'var(--madhubani-red)'}}>✸</span>
                    <span className="symbol" style={{color: 'var(--madhubani-green)'}}>◆</span>
                    <span className="peacock-feather">🪶</span>
                    <span className="symbol" style={{color: 'var(--madhubani-blue)'}}>◆</span>
                    <span className="symbol" style={{color: 'var(--madhubani-red)'}}>✸</span>
                </div>
            );

            return (
                <div className="clock-container">
                    <h1 className="header-title">Yogi's Madhubani Clock</h1>
                    
                    <MadhubaniDecor />
                    
                    <div className="time-display">
                        {hours}:{minutes}
                        <span className="seconds">{seconds}</span>
                    </div>

                    <div className="date-display">
                        {dateStr}
                    </div>

                    <MadhubaniDecor />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
