<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yogi's Madhubani Clock</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Varela+Round&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --madhubani-bg: #FCF4DF;
            --madhubani-red: #D32F2F;
            --madhubani-green: #388E3C;
            --madhubani-blue: #1976D2;
            --madhubani-text: #212121;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--madhubani-bg);
            background-image: radial-gradient(circle at center, rgba(255,255,255,0.5) 0%, transparent 100%);
            font-family: 'Varela Round', sans-serif;
            overflow: hidden;
        }

        .clock-container {
            text-align: center;
            padding: 2rem;
            position: relative;
        }

        .header-title {
            font-family: 'Uncial Antiqua', serif;
            font-size: clamp(1.2rem, 5vw, 2.2rem);
            color: var(--madhubani-text);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .decor-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .peacock-feather {
            font-size: clamp(2rem, 10vw, 3.5rem);
            animation: swing 3s ease-in-out infinite;
            display: inline-block;
            transform-origin: bottom center;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .time-display {
            font-family: 'Uncial Antiqua', serif;
            font-size: clamp(3.5rem, 20vw, 8rem);
            font-weight: 700;
            color: var(--madhubani-text);
            display: flex;
            justify-content: center;
            align-items: baseline;
            line-height: 1;
        }

        .seconds {
            font-size: 0.35em;
            color: var(--madhubani-red);
            margin-left: 15px;
            opacity: 0.8;
        }

        .date-display {
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            color: var(--madhubani-text);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-top: 15px;
            font-weight: bold;
        }

        .btn-container {
            margin-top: 40px;
        }

        .audio-toggle {
            padding: 10px 25px;
            border: 2px solid var(--madhubani-text);
            background: transparent;
            cursor: pointer;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            font-size: 0.7rem;
            letter-spacing: 1px;
        }

        .audio-toggle:hover {
            background: var(--madhubani-text);
            color: white;
        }

        .audio-toggle.active {
            border-color: var(--madhubani-green);
            color: var(--madhubani-green);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [time, setTime] = useState(new Date());
            const [isMuted, setIsMuted] = useState(true);
            const audioCtx = useRef(null);

            // Realistic Mechanical Tick using White Noise
            const playMechanicalTick = () => {
                if (isMuted) return;
                
                if (!audioCtx.current) {
                    audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
                }

                const context = audioCtx.current;
                const bufferSize = context.sampleRate * 0.02; // very short burst
                const buffer = context.createBuffer(1, bufferSize, context.sampleRate);
                const data = buffer.getChannelData(0);

                // Create white noise
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = context.createBufferSource();
                noise.buffer = buffer;

                const filter = context.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200; // Wood-like frequency
                filter.Q.value = 1;

                const gain = context.createGain();
                gain.gain.setValueAtTime(0.1, context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.015);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(context.destination);

                noise.start();
            };

            useEffect(() => {
                const timer = setInterval(() => {
                    setTime(new Date());
                    playMechanicalTick();
                }, 1000);
                return () => clearInterval(timer);
            }, [isMuted]);

            const hours = time.getHours().toString().padStart(2, '0');
            const minutes = time.getMinutes().toString().padStart(2, '0');
            const seconds = time.getSeconds().toString().padStart(2, '0');

            return (
                <div className="clock-container">
                    <h1 className="header-title">YOGI'S CHRONICLE</h1>
                    
                    <div className="decor-row">
                        <span className="peacock-feather">🪶</span>
                    </div>
                    
                    <div className="time-display">
                        {hours}:{minutes}
                        <span className="seconds">{seconds}</span>
                    </div>

                    <div className="date-display">
                        {time.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' })}
                    </div>

                    <div className="btn-container">
                        <button 
                            className={`audio-toggle ${!isMuted ? 'active' : ''}`}
                            onClick={() => {
                                if (audioCtx.current?.state === 'suspended') audioCtx.current.resume();
                                setIsMuted(!isMuted);
                            }}
                        >
                            {isMuted ? "🔈 ENABLE TICK-TOCK" : "🔊 SOUND ON"}
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
