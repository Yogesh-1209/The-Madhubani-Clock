<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yogi's Madhubani Clock</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Varela+Round&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --madhubani-bg: #FCF4DF;
            --madhubani-border: #8B0000;
            --madhubani-red: #D32F2F;
            --madhubani-green: #388E3C;
            --madhubani-blue: #1976D2;
            --madhubani-text: #212121;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--madhubani-bg);
            /* Textured background pattern */
            background-image: 
                linear-gradient(rgba(252, 244, 223, 0.9), rgba(252, 244, 223, 0.9)),
                url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3%3Cpath d="M10 20 L20 10 L30 20 L20 30 Z" fill="%23D32F2F" fill-opacity="0.1"/%3%3Cpath d="M40 50 L50 40 L60 50 L50 60 Z" fill="%23388E3C" fill-opacity="0.1"/%3%3Cpath d="M70 80 L80 70 L90 80 L80 90 Z" fill="%231976D2" fill-opacity="0.1"/%3%3C/svg%3E');
            font-family: 'Varela Round', sans-serif;
            overflow: hidden;
        }

        #root {
            z-index: 1;
        }

        .clock-container {
            border: 20px solid var(--madhubani-border);
            border-image: repeating-linear-gradient(
                -45deg,
                var(--madhubani-red),
                var(--madhubani-red) 10px,
                var(--madhubani-green) 10px,
                var(--madhubani-green) 20px,
                var(--madhubani-blue) 20px,
                var(--madhubani-blue) 30px
            ) 20;
            border-radius: 5px; /* Slight corner radius still */
            padding: 3rem 5rem;
            text-align: center;
            background-color: var(--madhubani-bg);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Decorative patterns around the time */
        .clock-container::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 1px solid var(--madhubani-text);
            pointer-events: none;
        }
        
        /* Stylized Header/Title */
        .header-title {
            font-family: 'Uncial Antiqua', serif;
            font-size: 2.5rem;
            color: var(--madhubani-text);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            border-bottom: 2px solid var(--madhubani-text);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .decorative-symbol {
            font-size: 2rem;
            margin: 0 10px;
            display: inline-block;
        }

        .symbol-red { color: var(--madhubani-red); }
        .symbol-green { color: var(--madhubani-green); }
        .symbol-blue { color: var(--madhubani-blue); }

        .time-display {
            font-family: 'Uncial Antiqua', serif; /* Hand-drawn feel */
            font-size: 6rem;
            font-weight: 700;
            color: var(--madhubani-text);
            letter-spacing: -2px;
            margin: 0;
            text-shadow: 2px 2px 0 var(--madhubani-bg), -2px -2px 0 var(--madhubani-bg), 2px -2px 0 var(--madhubani-bg), -2px 2px 0 var(--madhubani-bg);
            position: relative;
        }

        .date-display {
            font-size: 1.2rem;
            color: var(--madhubani-text);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 10px;
            font-family: 'Varela Round', sans-serif;
        }

        .seconds {
            font-size: 2.5rem;
            opacity: 0.8;
            margin-left: 10px;
            position: relative;
            top: -0.5rem; /* Slightly adjust alignment */
        }

        /* Peacock Feather Motifs */
        .peacock-feather {
            font-size: 4rem;
            display: inline-block;
            margin: -20px 20px -20px 20px;
        }

        @media (max-width: 600px) {
            .time-display { font-size: 3.5rem; }
            .clock-container { padding: 2rem; border-width: 10px; border-image-width: 10; }
            .seconds { font-size: 1.5rem; }
            .peacock-feather { font-size: 2rem; margin: -10px 10px -10px 10px; }
            .header-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [time, setTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const formatTime = (date) => {
                const hours = date.getHours().toString().padStart(2, '0');
                const minutes = date.getMinutes().toString().padStart(2, '0');
                const seconds = date.getSeconds().toString().padStart(2, '0');
                return { hours, minutes, seconds };
            };

            const formatDate = (date) => {
                const options = { weekday: 'long', month: 'long', day: 'numeric' };
                return date.toLocaleDateString(undefined, options);
            };

            const { hours, minutes, seconds } = formatTime(time);

            // Simple Unicode or character symbols for decoration
            const decorativeSymbols = [
                <span className="decorative-symbol symbol-red">★</span>,
                <span className="decorative-symbol symbol-green">◆</span>,
                <span className="decorative-symbol symbol-blue">✺</span>,
            ];

            return (
                <div className="clock-container">
                    
                    <div className="header-title">Yogi's Madhubani Clock</div>

                    <div className="top-decor">
                        {decorativeSymbols[0]}
                        {decorativeSymbols[1]}
                        {decorativeSymbols[2]}
                        <span className="peacock-feather">🪶</span>
                        {decorativeSymbols[2]}
                        {decorativeSymbols[1]}
                        {decorativeSymbols[0]}
                    </div>
                    
                    <div className="time-display">
                        {hours}:{minutes}
                        <span className="seconds">{seconds}</span>
                    </div>

                    <div className="date-display">
                        {formatDate(time)}
                    </div>

                    <div className="bottom-decor">
                        {decorativeSymbols[0]}
                        {decorativeSymbols[1]}
                        {decorativeSymbols[2]}
                         <span className="peacock-feather">🪶</span>
                        {decorativeSymbols[2]}
                        {decorativeSymbols[1]}
                        {decorativeSymbols[0]}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
